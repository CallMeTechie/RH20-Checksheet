# Apache-vhost für das RH20-Prüfprotokoll.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Die SQLite-Datenbank darf nicht per HTTP herunterladbar sein.
    # Steht bewusst hier und nicht nur in data/.htaccess, weil AllowOverride
    # None gesetzt ist und .htaccess-Dateien deshalb ignoriert werden.
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
    <LocationMatch "^/data(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "\.(sqlite|sqlite3|db)$">
        Require all denied
    </FilesMatch>

    # Die Anwendung läuft ohne Login im LAN — zumindest die Standard-Header
    # gegen Clickjacking und MIME-Sniffing kosten nichts.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
